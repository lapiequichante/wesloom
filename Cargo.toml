[workspace]
resolver = "2"
members = [
    "crates/wesloom-core",
    "crates/wesloom-render",
    "crates/wesloom-editor",
    "crates/wesloom-stdlib",
    "crates/wesloom",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
authors = ["Florian Villard"]
repository = "https://github.com/CHANGEME/wesloom"
homepage = "https://github.com/CHANGEME/wesloom"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wesloom-core = { path = "crates/wesloom-core", version = "0.0.0" }
wesloom-render = { path = "crates/wesloom-render", version = "0.0.0" }
wesloom-editor = { path = "crates/wesloom-editor", version = "0.0.0" }
wesloom-stdlib = { path = "crates/wesloom-stdlib", version = "0.0.0" }

# WESL -> WGSL compiler (ADR 0003). Pinned exactly: WESL is 0.x and its
# import/conditional-translation syntax is still moving.
wesl = "=0.4.4"
# GPU API for wesloom-render (ADR 0005).
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Demo/example-only (dev-dependencies; never in a library's dependency list).
winit = "0.30"
pollster = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# egui = "..."  # added once the editor UI work starts; see docs/adr/0004.

[profile.dev.package."*"]
opt-level = 1
