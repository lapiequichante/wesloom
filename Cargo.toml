[workspace]
resolver = "2"
members = [
    "crates/wxsl-core",
    "crates/wxsl-lang",
    "crates/wxsl-render",
    "crates/wxsl-editor",
    "crates/wxsl-stdlib",
    "crates/wxsl",
]

[workspace.package]
edition = "2021"
rust-version = "1.82"
authors = ["Florian Villard"]
repository = "https://github.com/lapiequichante/wxsl"
homepage = "https://github.com/lapiequichante/wxsl"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wxsl-core = { path = "crates/wxsl-core", version = "0.0.0" }
wxsl-lang = { path = "crates/wxsl-lang", version = "0.0.0" }
wxsl-render = { path = "crates/wxsl-render", version = "0.0.0" }
wxsl-editor = { path = "crates/wxsl-editor", version = "0.0.0" }
wxsl-stdlib = { path = "crates/wxsl-stdlib", version = "0.0.0" }

# Parser generator for the WXSL shading language (ADR 0011). Build
# dependency of wxsl-lang only; `lalrpop-util` is the runtime half.
lalrpop = { version = "0.22", default-features = false }
lalrpop-util = { version = "0.22", default-features = false }
# GPU API for wxsl-render (ADR 0005).
wgpu = "30.0.1"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Demo/example-only (dev-dependencies; never in a library's dependency list).
winit = "0.30"
pollster = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

# egui = "..."  # added once the editor UI work starts; see docs/adr/0004.

[profile.dev.package."*"]
opt-level = 1
