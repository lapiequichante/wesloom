[package]
name = "wesloom"
description = "WESL shader node graphs on wgpu, with an optional visual node editor. See README for feature flags."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
wesloom-core = { workspace = true }
wesloom-render = { workspace = true, optional = true }
wesloom-editor = { workspace = true, optional = true }
wesloom-stdlib = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }

[features]
default = ["render", "stdlib"]
render = ["dep:wesloom-render"]
editor = ["dep:wesloom-editor", "render"]
stdlib = ["dep:wesloom-stdlib"]

[[example]]
name = "pbr_cube"
# The demo needs the renderer and the node library; without them there is
# nothing to run, so cargo skips it instead of failing to build.
required-features = ["render", "stdlib"]

[[test]]
name = "graph_to_wgsl"
required-features = ["render", "stdlib"]

[[test]]
name = "render_cube"
required-features = ["render", "stdlib"]
