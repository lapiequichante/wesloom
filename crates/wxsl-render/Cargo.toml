[package]
name = "wxsl-render"
description = "wgpu-based renderer for wxsl: pipeline abstraction with automatic forward/deferred shader variant switching."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
wxsl-core = { workspace = true }
wxsl-lang = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
ttf-parser = { workspace = true }
# The stock pipelines are shipped as preset documents (plan2 P3) and parsed
# at startup; the graphs themselves stay plain data without it.
serde_json = { workspace = true }
# glTF/GLB geometry import, optional: a renderer that cannot load a mesh is
# a toy, and a renderer that always pulls in an asset pipeline is a tax.
gltf = { workspace = true, optional = true }

[features]
default = []
# Read geometry from glTF/GLB files (`crate::gltf`).
gltf = ["dep:gltf"]
