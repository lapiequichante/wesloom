[package]
name = "wxsl"
description = "WESL shader node graphs on wgpu, with an optional visual node editor. See README for feature flags."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
wxsl-core = { workspace = true }
wxsl-render = { workspace = true, optional = true }
wxsl-editor = { workspace = true, optional = true }
wxsl-stdlib = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
pollster = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }

[features]
default = ["render", "stdlib"]
render = ["dep:wxsl-render"]
editor = ["dep:wxsl-editor", "render"]
stdlib = ["dep:wxsl-stdlib"]
# glTF/GLB geometry import, for scenes whose meshes come from a file.
gltf = ["render", "wxsl-render/gltf"]

[[example]]
name = "pbr_cube"
# The demo needs the renderer and the node library; without them there is
# nothing to run, so cargo skips it instead of failing to build.
required-features = ["render", "stdlib"]

[[example]]
name = "editor"
# The editor example needs the editor (and so the renderer) and the node
# library; without them there is nothing to edit.
required-features = ["editor", "stdlib"]

[[test]]
name = "graph_to_wgsl"
required-features = ["render", "stdlib"]

[[test]]
name = "render_cube"
required-features = ["render", "stdlib"]

[[test]]
name = "editor_frame"
# Drives the editor for a few frames on a real device; skips when there is no
# adapter, like render_cube.rs.
required-features = ["editor", "stdlib"]

[[test]]
name = "scene"
# The scene document and its translation into a draw list; the rendering
# half skips when there is no adapter, like render_cube.rs.
required-features = ["render", "stdlib"]

[[test]]
name = "wgsl_types"
# Checks `ValueType`'s operator typing rules against wgpu's own validator,
# so it needs a device; skips when there is no adapter, like render_cube.rs.
required-features = ["render", "stdlib"]

[[example]]
name = "gallery"
# Every demo is the renderer plus the node library through a different
# pipeline; without them there is nothing to show.
required-features = ["render", "stdlib"]

# The tests below follow the same rule as the ones above: each needs the
# features its harness compiles against (`probe` drives the renderer on a
# real device, so every one of them needs `render`), and the stdlib-consuming
# ones need `stdlib` too. Declared per target so a `--no-default-features`
# build skips them instead of failing to compile.
[[test]]
name = "ambient_ibl"
required-features = ["render"]

[[test]]
name = "frame_of_reference"
required-features = ["render"]

[[test]]
name = "screen_graphs"
required-features = ["render"]

[[test]]
name = "stage_analysis"
required-features = ["render"]

[[test]]
name = "buffer_resources"
required-features = ["render", "stdlib"]

[[test]]
name = "execution_policies"
required-features = ["render", "stdlib"]

[[test]]
name = "interpolants"
required-features = ["render", "stdlib"]

[[test]]
name = "lighting_models"
required-features = ["render", "stdlib"]

[[test]]
name = "material_geometry"
required-features = ["render", "stdlib"]

[[test]]
name = "material_resources"
required-features = ["render", "stdlib"]

[[test]]
name = "semantic_channels"
required-features = ["render", "stdlib"]

[[test]]
name = "shadows"
required-features = ["render", "stdlib"]
