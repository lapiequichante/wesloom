<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="-4 -4 646.11 590.87"
   role="img"
   aria-label="wxsl"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>wxsl</title>
  <defs>
    <!-- the mark's body: deep indigo, violet towards the bottom tip -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="300" y1="7" x2="190" y2="390">
      <stop offset="0" stop-color="#2440F2" />
      <stop offset="0.45" stop-color="#1A10C2" />
      <stop offset="0.78" stop-color="#3418D6" />
      <stop offset="1" stop-color="#B43CF5" />
    </linearGradient>
    <!-- the W's left stroke: cyan at the top, blue, violet at the tip -->
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="215" y2="390">
      <stop offset="0" stop-color="#3FEAFF" />
      <stop offset="0.35" stop-color="#1C8EFF" />
      <stop offset="0.75" stop-color="#2F3CEB" />
      <stop offset="1" stop-color="#A63DF2" />
    </linearGradient>
    <linearGradient id="upper" gradientUnits="userSpaceOnUse" x1="465" y1="22" x2="440" y2="202">
      <stop offset="0" stop-color="#2AA6FF" />
      <stop offset="0.5" stop-color="#2124DC" />
      <stop offset="1" stop-color="#5F26E6" />
    </linearGradient>
    <linearGradient id="lower" gradientUnits="userSpaceOnUse" x1="365" y1="215" x2="500" y2="392">
      <stop offset="0" stop-color="#2FD8FF" />
      <stop offset="0.4" stop-color="#2A52EE" />
      <stop offset="0.75" stop-color="#3A1BD6" />
      <stop offset="1" stop-color="#BC3EF2" />
    </linearGradient>
    <linearGradient id="diamond-top" gradientUnits="userSpaceOnUse" x1="585" y1="18" x2="585" y2="98">
      <stop offset="0" stop-color="#2FB4FF" />
      <stop offset="1" stop-color="#2618C8" />
    </linearGradient>
    <linearGradient id="diamond-bottom" gradientUnits="userSpaceOnUse" x1="542" y1="112" x2="630" y2="150">
      <stop offset="0" stop-color="#33DCFF" />
      <stop offset="0.55" stop-color="#3A44EC" />
      <stop offset="1" stop-color="#B43EF2" />
    </linearGradient>
    <linearGradient id="letters" gradientUnits="userSpaceOnUse" x1="33" y1="500" x2="605" y2="530">
      <stop offset="0" stop-color="#38D4FF" />
      <stop offset="0.3" stop-color="#1F6CF4" />
      <stop offset="0.7" stop-color="#2A20D8" />
      <stop offset="1" stop-color="#6A22E4" />
    </linearGradient>
    <clipPath id="mark">
      <path d="M22.00 7.00L427.31 7.00A15.0006 15.0006 0 0 1 440.30 29.50L237.65 380.51A15.0006 15.0006 0 0 1 211.66 380.51L9.01 29.50A15.0006 15.0006 0 0 1 22.00 7.00Z" />
    </clipPath>
    <!-- neon colours: each shape's inset glow is a copy of it painted with
     one of these and passed through "neon", which keeps only the glow -->
    <linearGradient id="glow-v1" gradientUnits="userSpaceOnUse" x1="150" y1="7" x2="260" y2="390">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.35" stop-color="#34C8FF" />
      <stop offset="0.65" stop-color="#4A6BFF" />
      <stop offset="1" stop-color="#FF4FE8" />
    </linearGradient>
    <linearGradient id="glow-upper" gradientUnits="userSpaceOnUse" x1="465" y1="22" x2="440" y2="202">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.6" stop-color="#3F8CFF" />
      <stop offset="1" stop-color="#D24DFF" />
    </linearGradient>
    <linearGradient id="glow-lower" gradientUnits="userSpaceOnUse" x1="365" y1="215" x2="500" y2="392">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.45" stop-color="#3F7BFF" />
      <stop offset="1" stop-color="#FF4FE8" />
    </linearGradient>
    <linearGradient id="glow-diamonds" gradientUnits="userSpaceOnUse" x1="585" y1="18" x2="600" y2="190">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.5" stop-color="#6A6BFF" />
      <stop offset="1" stop-color="#FF4FE8" />
    </linearGradient>
    <linearGradient id="glow-letters" gradientUnits="userSpaceOnUse" x1="33" y1="500" x2="605" y2="530">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.4" stop-color="#3F9BFF" />
      <stop offset="0.75" stop-color="#8A5BFF" />
      <stop offset="1" stop-color="#FF4FE8" />
    </linearGradient>
    <linearGradient id="glow-nodes" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#45F4FF" />
      <stop offset="0.5" stop-color="#3F8CFF" />
      <stop offset="1" stop-color="#FF4FE8" />
    </linearGradient>
    <!-- the first node is dark with a cyan halo -->
    <linearGradient id="glow-node-cyan" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5AF6FF" />
      <stop offset="1" stop-color="#2FB8FF" />
    </linearGradient>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="outside">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur in="outside" stdDeviation="11" result="wide" />
      <feGaussianBlur in="outside" stdDeviation="3" result="tight" />
      <feComposite in="SourceGraphic" in2="wide" operator="in" result="halo" />
      <feColorMatrix in="SourceGraphic" type="matrix" result="hot"
         values="1.15 0 0 0 0.05  0 1.15 0 0 0.05  0 0 1.15 0 0.05  0 0 0 1 0" />
      <feComposite in="hot" in2="tight" operator="in" result="core" />
      <feMerge result="glow">
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="core" />
        <feMergeNode in="core" />
      </feMerge>
      <feComposite in="glow" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="neon-small" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="outside">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur in="outside" stdDeviation="6" result="wide" />
      <feGaussianBlur in="outside" stdDeviation="1.8" result="tight" />
      <feComposite in="SourceGraphic" in2="wide" operator="in" result="halo" />
      <feColorMatrix in="SourceGraphic" type="matrix" result="hot"
         values="1.15 0 0 0 0.05  0 1.15 0 0 0.05  0 0 1.15 0 0.05  0 0 0 1 0" />
      <feComposite in="hot" in2="tight" operator="in" result="core" />
      <feMerge result="glow">
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="core" />
        <feMergeNode in="core" />
      </feMerge>
      <feComposite in="glow" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="neon-tiny" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="outside">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur in="outside" stdDeviation="3.5" result="wide" />
      <feGaussianBlur in="outside" stdDeviation="1.2" result="tight" />
      <feComposite in="SourceGraphic" in2="wide" operator="in" result="halo" />
      <feColorMatrix in="SourceGraphic" type="matrix" result="hot"
         values="1.15 0 0 0 0.05  0 1.15 0 0 0.05  0 0 1.15 0 0.05  0 0 0 1 0" />
      <feComposite in="hot" in2="tight" operator="in" result="core" />
      <feMerge result="glow">
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="core" />
        <feMergeNode in="core" />
      </feMerge>
      <feComposite in="glow" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="neon-node" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="outside">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur in="outside" stdDeviation="6" result="wide" />
      <feGaussianBlur in="outside" stdDeviation="2" result="tight" />
      <feComposite in="SourceGraphic" in2="wide" operator="in" result="halo" />
      <feColorMatrix in="SourceGraphic" type="matrix" result="hot"
         values="1.15 0 0 0 0.05  0 1.15 0 0 0.05  0 0 1.15 0 0.05  0 0 0 1 0" />
      <feComposite in="hot" in2="tight" operator="in" result="core" />
      <feMerge result="glow">
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="halo" />
        <feMergeNode in="core" />
        <feMergeNode in="core" />
      </feMerge>
      <feComposite in="glow" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
